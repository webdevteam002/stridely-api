# Render Blueprint — Stridely NestJS API
# https://render.com/docs/blueprint-spec
#
# Secrets (DATABASE_URL, JWT_SECRET, GOOGLE_CLIENT_ID, CORS_ORIGINS) must be
# set in the Render dashboard — never commit real values.

services:
  - type: web
    name: stridely-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: API_PREFIX
        value: api/v1
      - key: APP_NAME
        value: stridely-api
      - key: APP_VERSION
        value: 0.1.0
      - key: LOG_LEVEL
        value: info
      - key: SWAGGER_ENABLED
        value: "false"
      - key: SKIP_DB_CONNECT
        value: "false"
      - key: JWT_ISSUER
        value: stridely-api
      - key: JWT_AUDIENCE
        value: stridely-app
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: "30"
      - key: AUTH_THROTTLE_TTL_MS
        value: "60000"
      - key: AUTH_THROTTLE_LIMIT
        value: "60"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
